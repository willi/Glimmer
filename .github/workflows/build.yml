name: Build

# Proves the package builds with the iOS 26 SDK (Xcode 26.5), the oldest toolchain hosts such as SuperMe use in CI.
# The `macos-26` runner image has no Xcode 27, so iOS 27 SDK builds are covered by local development and the tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ios-26-sdk:
    name: Build (Xcode 26.5, iOS 26 SDK)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: xcodebuild -scheme Glimmer -destination 'generic/platform=iOS Simulator' build
