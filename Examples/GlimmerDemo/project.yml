name: GlimmerDemo
options:
  bundleIdPrefix: dk.wu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: RUV7V2TGVX
    CODE_SIGN_STYLE: Automatic
packages:
  Glimmer:
    path: ../..
targets:
  GlimmerDemo:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: Glimmer
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Glimmer
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # ProMotion: without this key an iPhone app is capped at 60 Hz, which would hide hitches at 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.wu.GlimmerDemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  GlimmerDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
      - path: Shared
    dependencies:
      - target: GlimmerDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.wu.GlimmerDemoUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GlimmerDemo
  # The package's performance tests, hosted by the demo app so they can run on a device (a package test bundle
  # can't: device destinations need a host application). Release runs pass ENABLE_TESTABILITY=YES.
  GlimmerDevicePerfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../Tests/GlimmerTests/Engine/GlimmerStreamingPerformanceTests.swift
      - path: ../../Tests/GlimmerTests/Engine/EngineTestSupport.swift
      - path: ../../Tests/GlimmerTests/Engine/StreamingFixtures.swift
    dependencies:
      - target: GlimmerDemo
      - package: Glimmer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.wu.GlimmerDevicePerfTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GlimmerDemo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GlimmerDemo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GlimmerDemo:
    build:
      targets:
        GlimmerDemo: all
        GlimmerDemoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlimmerDemoUITests
  GlimmerDevicePerf:
    build:
      targets:
        GlimmerDemo: all
        GlimmerDevicePerfTests: [test]
    test:
      config: Release
      targets:
        - GlimmerDevicePerfTests
    profile:
      config: Release
    archive:
      config: Release
